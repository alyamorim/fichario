<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fichário</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6EF;
    --bg-alt:#F3EBDD;
    --card:#FFFDF9;
    --ink:#453C33;
    --ink-soft:#8A7F72;
    --ink-faint:#B7AB9C;
    --border:#EEE3D2;

    --peach:#F3B991;
    --peach-soft:#FBE3D0;
    --peach-ink:#8A5A34;

    --lavender:#B9A6E3;
    --lavender-soft:#EAE3F7;
    --lavender-ink:#5A4A85;

    --sage:#8FAF83;
    --sage-soft:#E3EEDF;
    --sage-ink:#3E5C38;

    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
    --shadow-sm:0 2px 8px rgba(69,60,51,.05);
    --shadow-md:0 10px 30px rgba(69,60,51,.08);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Nunito',sans-serif;
    font-size:15.5px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand,.obra-item .titulo,.cap-link-titulo{font-family:'Lora',serif;}
  .chip{font-family:'Fredoka',sans-serif;}

  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}

  .app{
    display:grid;
    grid-template-columns:320px 1fr;
    height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--bg-alt);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:22px 20px 14px;
    font-size:22px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    transition:opacity .12s;
  }
  .brand:hover{opacity:0.75;}
  .brand svg{flex-shrink:0;}

  .sidebar-body{
    padding:0 16px 16px;
    overflow-y:auto;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .search-box{
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:10px 14px 10px 38px;
    border-radius:var(--radius-md);
    border:1px solid var(--border);
    background:var(--card);
    color:var(--ink);
    font-size:14.5px;
    outline:none;
    transition:border-color .15s;
  }
  .search-box input:focus{border-color:var(--lavender);}
  .search-box svg{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:var(--ink-faint);
  }

  .btn-new{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--peach);
    color:#5C3A1E;
    border:none;
    border-radius:var(--radius-md);
    padding:11px 16px;
    font-size:15px;
    font-weight:600;
    box-shadow:var(--shadow-sm);
    transition:transform .12s, box-shadow .12s;
  }
  .btn-new:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);}
  .btn-new:active{transform:translateY(0);}

  .filter-group{display:flex;flex-direction:column;gap:8px;}
  .filter-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-faint);
    padding-left:2px;
  }
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--ink-soft);
    padding:5px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
    transition:all .12s;
    white-space:nowrap;
  }
  .chip:hover{border-color:var(--ink-faint);}
  .chip.active-tipo{background:var(--lavender);border-color:var(--lavender);color:#3A2E63;}
  .chip.active-tag{background:var(--sage);border-color:var(--sage);color:#2C4327;}
  .chip.active-extra{background:var(--sage);border-color:var(--sage);color:#2C4327;}

  .lista-obras{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:2px;
  }
  .obra-item{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:12px 14px;
    cursor:pointer;
    transition:border-color .12s, transform .12s;
  }
  .obra-item:hover{border-color:var(--ink-faint);}
  .obra-item.selected{
    border-color:var(--peach);
    box-shadow:0 0 0 2px var(--peach-soft);
  }
  .obra-item .titulo{
    font-weight:700;
    font-size:14.5px;
    color:var(--ink);
    margin-bottom:2px;
  }
  .obra-item .autor{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .obra-item .meta-row{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .tipo-badge{
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .tipo-badge.livro{background:var(--lavender-soft);color:var(--lavender-ink);}
  .tipo-badge.ensaio{background:var(--sage-soft);color:var(--sage-ink);}
  .tipo-badge.artigo{background:var(--peach-soft);color:var(--peach-ink);}
  .tag-mini{
    font-size:11px;
    color:var(--ink-faint);
  }

  .empty-lista{
    color:var(--ink-faint);
    font-size:13.5px;
    padding:20px 6px;
    text-align:center;
  }

  .sync-box{
    padding:14px 16px;
    border-top:1px solid var(--border);
  }
  .sync-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:transparent;
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:9px 12px;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-soft);
    transition:border-color .12s, color .12s;
  }
  .sync-btn:hover{border-color:var(--sage);color:var(--sage-ink);}
  .sync-status{
    font-size:11.5px;
    color:var(--ink-faint);
    text-align:center;
    margin-top:6px;
  }

  /* ---------- Main ---------- */
  .main{
    overflow-y:auto;
    position:relative;
  }
  .main-watermark{
    position:fixed;
    top:22px;
    right:28px;
    opacity:0.32;
    pointer-events:none;
    z-index:1;
  }

  .empty-state{
    display:none;
  }
  .empty-state.state-empty{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
  }
  .empty-state.state-empty h2{
    font-size:22px;
    font-weight:600;
    margin:18px 0 6px;
    color:var(--ink);
  }
  .empty-state.state-empty p{
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:320px;
    margin:0;
  }

  .empty-state.state-dashboard{
    display:block;
    max-width:920px;
    margin:0 auto;
    padding:36px 40px 80px;
  }
  .home-header{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:30px;
  }
  .home-header h2{
    font-size:24px;
    font-weight:600;
    margin:0 0 4px;
    color:var(--ink);
  }
  .home-subtitle{margin:0;color:var(--ink-soft);font-size:14px;}

  .tag-cloud{
    display:flex;
    flex-wrap:wrap;
    gap:8px 18px;
    align-items:baseline;
    margin-bottom:32px;
    padding-bottom:26px;
    border-bottom:1px solid var(--border);
  }
  .tag-cloud-item{
    background:none;
    border:none;
    color:var(--lavender-ink);
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    line-height:1.2;
    padding:3px 6px;
    border-radius:8px;
    transition:color .12s, background .12s;
  }
  .tag-cloud-item:hover{background:var(--lavender-soft);}
  .tag-cloud-item.active{background:var(--sage-soft);color:var(--sage-ink);}

  .fichas-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px,1fr));
    gap:16px;
  }
  .ficha-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px 18px;
    cursor:pointer;
    transition:border-color .12s, box-shadow .12s;
  }
  .ficha-card:hover{border-color:var(--sage);box-shadow:var(--shadow-sm);}
  .ficha-titulo{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:16px;
    color:var(--ink);
    margin:9px 0 2px;
  }
  .ficha-autor{font-size:12.5px;color:var(--ink-soft);margin-bottom:9px;}
  .ficha-tags{display:flex;flex-wrap:wrap;gap:6px;}

  .obra-detail{
    max-width:760px;
    margin:0 auto;
    padding:36px 40px 80px;
    transition:max-width .15s;
  }
  .obra-detail.wide-leitura{max-width:920px;}
  .obra-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:6px;
  }
  .obra-header h1{
    font-size:28px;
    font-weight:600;
    margin:0 0 4px;
    color:var(--ink);
  }
  .obra-header .autor{
    font-size:15px;
    color:var(--ink-soft);
    margin:0;
  }
  .obra-actions{display:flex;gap:8px;flex-shrink:0;}
  .icon-btn{
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    border-radius:var(--radius-sm);
    border:1px solid var(--border);
    background:var(--card);
    color:var(--ink-soft);
    transition:border-color .12s, color .12s;
  }
  .icon-btn:hover{border-color:var(--ink-faint);color:var(--ink);}
  .icon-btn.danger:hover{border-color:#D98F8F;color:#B85454;}

  .obra-tags{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin:14px 0 30px;
  }
  .obra-tags .tag-static{
    font-size:12px;
    padding:4px 11px;
    border-radius:999px;
    background:var(--lavender-soft);
    color:var(--lavender-ink);
    font-weight:600;
  }

  .capitulo-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:20px 22px;
    box-shadow:var(--shadow-sm);
  }
  .capitulo-card h3{
    font-size:15.5px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--peach-ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .cap-num-badge{
    background:var(--peach-soft);
    color:var(--peach-ink);
    width:24px;height:24px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;
    font-weight:700;
    flex-shrink:0;
  }

  .capitulos-lista{display:flex;flex-direction:column;gap:8px;}
  .capitulo-link{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:13px 16px;
    cursor:pointer;
    transition:border-color .12s, transform .12s;
  }
  .capitulo-link:hover{border-color:var(--sage);}
  .cap-link-titulo{
    font-weight:600;
    font-size:14.5px;
    color:var(--ink);
    flex-shrink:0;
  }
  .cap-link-preview{
    font-size:13px;
    color:var(--ink-faint);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }
  .cap-link-chevron{color:var(--ink-faint);flex-shrink:0;}

  .btn-voltar{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:13.5px;
    font-weight:600;
    padding:0 0 18px;
    font-family:'Fredoka',sans-serif;
  }
  .btn-voltar:hover{color:var(--sage-ink);}
  .campo-label{
    font-size:12px;
    font-weight:700;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:.03em;
    margin:12px 0 6px;
  }
  .campo-label:first-of-type{margin-top:0;}
  .format-toolbar{
    display:flex;
    gap:6px;
    margin-bottom:8px;
  }
  .format-btn{
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    border-radius:var(--radius-sm);
    border:1px solid var(--border);
    background:#FFFFFF;
    color:var(--ink-soft);
    font-size:14px;
    transition:border-color .12s,color .12s;
  }
  .format-btn:hover{border-color:var(--sage);color:var(--sage-ink);}
  .format-btn.active-format{background:var(--sage-soft);border-color:var(--sage);color:var(--sage-ink);}
  textarea.nota-field{
    width:100%;
    min-height:64px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    background:#FFFFFF;
    color:var(--ink);
    font-size:14.5px;
    line-height:1.6;
    resize:vertical;
    outline:none;
    transition:border-color .15s;
  }
  textarea.nota-field:focus{border-color:var(--sage);}
  textarea.nota-field-grande{min-height:280px;margin-bottom:12px;}

  .btn-salvar-nota{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:9px 18px;
    border-radius:var(--radius-md);
    border:none;
    background:var(--sage);
    color:#25391F;
    font-size:13.5px;
    font-weight:700;
    font-family:'Fredoka',sans-serif;
    box-shadow:var(--shadow-sm);
  }
  .btn-salvar-nota:hover{box-shadow:var(--shadow-md);}

  .nota-leitura{
    font-family:'Lora',serif;
    font-weight:400;
    font-size:18.5px;
    line-height:1.9;
    color:var(--ink);
    white-space:pre-wrap;
    margin-bottom:26px;
  }
  .nota-leitura.justificado{text-align:justify;}
  .capitulo-card.modo-leitura{padding:34px 38px;}
  .btn-editar-nota{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:6px;
    width:100%;
    background:none;
    border:none;
    border-top:1px solid var(--border);
    padding-top:16px;
    color:var(--ink-faint);
    font-size:13px;
    font-weight:600;
    font-family:'Fredoka',sans-serif;
  }
  .btn-editar-nota:hover{color:var(--sage-ink);}

  .nota-livre-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px;
    box-shadow:var(--shadow-sm);
  }
  .nota-livre-card textarea{min-height:340px;}

  .save-hint{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:20px;
    text-align:center;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(69,60,51,.28);
    display:none;
    align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--card);
    border-radius:var(--radius-lg);
    padding:28px 30px 26px;
    width:100%;
    max-width:440px;
    box-shadow:0 20px 60px rgba(69,60,51,.22);
    max-height:88vh;
    overflow-y:auto;
  }
  .modal h2{font-size:19px;font-weight:600;margin:0 0 20px;}
  .modal-h2-com-icone{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .modal-texto{
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink-soft);
    margin:0 0 22px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:.03em;
    margin-bottom:6px;
  }
  .field input[type=text], .field input[type=number], .field select{
    width:100%;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border);
    background:#FFFFFF;
    color:var(--ink);
    font-size:14.5px;
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus, .field select:focus{border-color:var(--lavender);}
  .tipo-toggle{display:flex;gap:8px;}
  .tipo-toggle button{
    flex:1;
    padding:9px 6px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border);
    background:#FFFFFF;
    color:var(--ink-soft);
    font-size:13.5px;
    font-weight:600;
    transition:all .12s;
  }
  .tipo-toggle button.active{
    background:var(--lavender);
    border-color:var(--lavender);
    color:#3A2E63;
  }
  .tag-input-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:8px 10px;
    background:#FFFFFF;
  }
  .tag-input-row input{
    border:none;outline:none;flex:1;min-width:80px;font-size:14px;background:transparent;
  }
  .tag-pill{
    background:var(--sage-soft);
    color:var(--sage-ink);
    font-size:12.5px;
    font-weight:600;
    padding:3px 8px 3px 10px;
    border-radius:999px;
    display:flex;align-items:center;gap:5px;
  }
  .tag-pill button{
    background:none;border:none;color:var(--sage-ink);font-size:13px;line-height:1;padding:0;opacity:.6;
  }
  .tag-pill button:hover{opacity:1;}

  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:22px;
  }
  .btn-secondary{
    padding:10px 18px;
    border-radius:var(--radius-md);
    border:1px solid var(--border);
    background:transparent;
    color:var(--ink-soft);
    font-size:14px;
    font-weight:600;
  }
  .btn-primary{
    padding:10px 20px;
    border-radius:var(--radius-md);
    border:none;
    background:var(--peach);
    color:#5C3A1E;
    font-size:14px;
    font-weight:700;
    box-shadow:var(--shadow-sm);
  }
  .btn-primary:hover{box-shadow:var(--shadow-md);}

  /* Toast */
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--bg);
    padding:11px 22px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    opacity:0;
    transition:all .25s;
    pointer-events:none;
    z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:760px){
    .app{grid-template-columns:1fr;}
    .sidebar{display:none;}
  }
</style>
</head>
<body>

<div class="app">
  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="brand" id="brandLogo" title="Voltar à página inicial">
      <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
        <g stroke="#8A5A34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 24 L9 40 L39 40 L37 24 Z"/>
          <ellipse cx="24" cy="24" rx="13" ry="3"/>
          <rect x="15" y="12" width="5" height="14" rx="1"/>
          <rect x="22" y="9" width="5" height="17" rx="1"/>
          <rect x="29" y="13" width="5" height="13" rx="1"/>
        </g>
      </svg>
      Fichário
    </div>

    <div class="sidebar-body">
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>

<script>
/* ============================================================
   ESTADO E PERSISTÊNCIA LOCAL
   ============================================================ */
const STORAGE_KEY = 'fichario_dados_v1';

function estadoPadrao(){ return { obras: [] }; }

function carregarEstado(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : estadoPadrao();
  }catch(e){ return estadoPadrao(); }
}

function salvarEstado(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(estado));
  agendarSyncAutomatico();
}

let estado = carregarEstado();
let obraSelecionadaId = null;
let capituloSelecionadoIdx = null;
let tagsModalAtual = [];
let editandoObraId = null;
let filtroTipoAtivo = null;
let filtrosTagAtivos = new Set();
let extrasModalAtual = { prefacio:false, introducao:false, conclusao:false };

const LABEL_SECAO = { prefacio:'Prefácio', introducao:'Introdução', conclusao:'Conclusão' };
const BADGE_SECAO = { prefacio:'P', introducao:'I', conclusao:'C' };

function labelCapitulo(cap){
  const tipo = cap.tipo || 'capitulo';
  return tipo === 'capitulo' ? ('Capítulo ' + cap.numero) : LABEL_SECAO[tipo];
}
function badgeCapitulo(cap){
  const tipo = cap.tipo || 'capitulo';
  return tipo === 'capitulo' ? cap.numero : BADGE_SECAO[tipo];
}
function stripFormatacao(texto){
  return texto.replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\*([^*]+)\*/g, '$1');
}
function previewCapitulo(cap){
  const texto = stripFormatacao((cap.texto || '').trim());
  if(!texto) return 'Sem notas ainda';
  return escapeHtml(texto.length > 70 ? texto.slice(0,70) + '…' : texto);
}
function formatarTextoLeitura(texto){
  let seguro = escapeHtml(texto);
  seguro = seguro.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  seguro = seguro.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return seguro;
}
function aplicarFormatacao(campo, marcador){
  const inicio = campo.selectionStart;
  const fim = campo.selectionEnd;
  const valor = campo.value;
  const selecionado = valor.slice(inicio, fim);
  campo.value = valor.slice(0, inicio) + marcador + selecionado + marcador + valor.slice(fim);
  campo.focus();
  const novaPos = selecionado ? fim + marcador.length*2 : inicio + marcador.length;
  campo.setSelectionRange(novaPos, novaPos);
  campo.dispatchEvent(new Event('input'));
}
function migrarCapitulo(c){
  if(!c) return c;
  if(c.texto === undefined){
    const partes = [c.resumo, c.comentario].filter(t => t && t.trim());
    c.texto = partes.join('\n\n');
    c.salvo = !!c.comentarioSalvo;
    delete c.resumo; delete c.comentario; delete c.comentarioSalvo;
  }
  return c;
}
function construirCapitulos(numCap, extras, capsAntigos){
  capsAntigos = capsAntigos || [];
  const achar = (tipo) => migrarCapitulo(capsAntigos.find(c => (c.tipo||'capitulo') === tipo));
  const acharCap = (numero) => migrarCapitulo(capsAntigos.find(c => (c.tipo||'capitulo')==='capitulo' && c.numero===numero));
  const resultado = [];
  if(extras.prefacio) resultado.push(achar('prefacio') || { tipo:'prefacio', numero:null, texto:'', salvo:false, justificado:false });
  if(extras.introducao) resultado.push(achar('introducao') || { tipo:'introducao', numero:null, texto:'', salvo:false, justificado:false });
  const total = Math.max(1, numCap || 1);
  for(let i=1;i<=total;i++){
    resultado.push(acharCap(i) || { tipo:'capitulo', numero:i, texto:'', salvo:false, justificado:false });
  }
  if(extras.conclusao) resultado.push(achar('conclusao') || { tipo:'conclusao', numero:null, texto:'', salvo:false, justificado:false });
  return resultado;
}

function uid(){ return 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ============================================================
   RENDER: LISTA LATERAL
   ============================================================ */
function todasAsTags(){
  const s = new Set();
  estado.obras.forEach(o => (o.tags||[]).forEach(t => s.add(t)));
  return Array.from(s).sort();
}

function renderFiltroTags(){
  const wrap = document.getElementById('filtroTagsWrap');
  const cont = document.getElementById('filtroTags');
  const tags = todasAsTags();
  if(tags.length === 0){ wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  cont.innerHTML = tags.map(t => `<button class="chip ${filtrosTagAtivos.has(t)?'active-tag':''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('');
  cont.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = btn.dataset.tag;
      if(filtrosTagAtivos.has(t)) filtrosTagAtivos.delete(t); else filtrosTagAtivos.add(t);
      renderTudo();
    });
  });
}

function obrasFiltradas(){
  const termo = (document.getElementById('busca').value || '').toLowerCase().trim();
  return estado.obras.filter(o=>{
    if(filtroTipoAtivo && o.tipo !== filtroTipoAtivo) return false;
    if(filtrosTagAtivos.size > 0){
      const tags = o.tags || [];
      for(const t of filtrosTagAtivos){ if(!tags.includes(t)) return false; }
    }
    if(termo){
      const alvo = (o.titulo + ' ' + o.autor).toLowerCase();
      if(!alvo.includes(termo)) return false;
    }
    return true;
  }).sort((a,b)=> (b.criadoEm||0) - (a.criadoEm||0));
}

const TIPO_LABEL = { livro:'Livro', ensaio:'Ensaio', artigo:'Artigo' };

const SVG_FICHARIO_MIOLO = `
  <g stroke="#8FAF83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 102 L42 168 L158 168 L152 102 Z"/>
    <ellipse cx="100" cy="102" rx="52" ry="10"/>
  </g>
  <g stroke="#453C33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="83" y="140" width="34" height="16" rx="2.5"/>
    <line x1="89" y1="148" x2="111" y2="148"/>
  </g>
  <g stroke="#B9A6E3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="63" y="52" width="15" height="52" rx="2"/>
    <line x1="63" y1="64" x2="78" y2="64"/>
  </g>
  <g stroke="#F3B991" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82 100 L82 58 L100 58 L106 66 L106 100 Z"/>
  </g>
  <g stroke="#8FAF83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="110" y="46" width="15" height="58" rx="2"/>
    <line x1="110" y1="60" x2="125" y2="60"/>
    <line x1="110" y1="68" x2="125" y2="68"/>
  </g>
  <g stroke="#B9A6E3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="rotate(8 132 100)">
    <rect x="129" y="62" width="14" height="44" rx="2"/>
  </g>
`;

function contarTags(){
  const counts = {};
  estado.obras.forEach(o => (o.tags||[]).forEach(t => { counts[t] = (counts[t]||0) + 1; }));
  return counts;
}

function renderHome(){
  const empty = document.getElementById('emptyState');

  if(estado.obras.length === 0){
    empty.classList.remove('state-dashboard');
    empty.classList.add('state-empty');
    empty.innerHTML = `
      <svg width="190" height="190" viewBox="0 0 200 200" fill="none" opacity="0.8">${SVG_FICHARIO_MIOLO}</svg>
      <h2>Seu fichário está vazio</h2>
      <p>Adicione um livro, ensaio ou artigo para começar a registrar fichamentos e impressões de leitura.</p>
    `;
    return;
  }

  empty.classList.remove('state-empty');
  empty.classList.add('state-dashboard');

  const counts = contarTags();
  const tags = Object.keys(counts).sort();
  const maxCount = Math.max(1, ...Object.values(counts));

  const nuvemHtml = tags.length ? `
    <div class="tag-cloud">
      ${tags.map(t => {
        const tamanho = Math.round(13 + (counts[t]/maxCount) * 15);
        const ativa = filtrosTagAtivos.has(t);
        return `<button type="button" class="tag-cloud-item ${ativa?'active':''}" data-tag="${escapeHtml(t)}" style="font-size:${tamanho}px">#${escapeHtml(t)}</button>`;
      }).join('')}
    </div>
  ` : '';

  const obrasHome = obrasFiltradas();
  const gradeHtml = obrasHome.length ? `
    <div class="fichas-grid">
      ${obrasHome.map(o => `
        <div class="ficha-card" data-id="${o.id}">
          <span class="tipo-badge ${o.tipo}">${TIPO_LABEL[o.tipo]}</span>
          <div class="ficha-titulo">${escapeHtml(o.titulo)}</div>
          <div class="ficha-autor">${escapeHtml(o.autor || 'Autor não informado')}</div>
          ${(o.tags||[]).length ? `<div class="ficha-tags">${(o.tags||[]).map(t=>`<span class="tag-mini">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        </div>
      `).join('')}
    </div>
  ` : '<div class="empty-lista">Nenhuma obra encontrada com os filtros atuais.</div>';

  empty.innerHTML = `
    <div class="home-header">
      <svg width="66" height="66" viewBox="0 0 200 200" fill="none">${SVG_FICHARIO_MIOLO}</svg>
      <div>
        <h2>Seu fichário</h2>
        <p class="home-subtitle">${estado.obras.length} obra${estado.obras.length>1?'s':''} catalogada${estado.obras.length>1?'s':''}</p>
      </div>
    </div>
    ${nuvemHtml}
    ${gradeHtml}
  `;

  empty.querySelectorAll('.tag-cloud-item').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = btn.dataset.tag;
      if(filtrosTagAtivos.has(t)) filtrosTagAtivos.delete(t); else filtrosTagAtivos.add(t);
      renderTudo();
    });
  });
  empty.querySelectorAll('.ficha-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      obraSelecionadaId = el.dataset.id;
      capituloSelecionadoIdx = null;
      renderTudo();
    });
  });
}

function renderLista(){
  const cont = document.getElementById('listaObras');
  const obras = obrasFiltradas();
  if(obras.length === 0){
    cont.innerHTML = '<div class="empty-lista">Nenhuma obra encontrada.</div>';
    return;
  }
  cont.innerHTML = obras.map(o => `
    <div class="obra-item ${o.id===obraSelecionadaId?'selected':''}" data-id="${o.id}">
      <div class="titulo">${escapeHtml(o.titulo)}</div>
      <div class="autor">${escapeHtml(o.autor || 'Autor não informado')}</div>
      <div class="meta-row">
        <span class="tipo-badge ${o.tipo}">${TIPO_LABEL[o.tipo]}</span>
        ${(o.tags||[]).slice(0,2).map(t=>`<span class="tag-mini">#${escapeHtml(t)}</span>`).join('')}
      </div>
    </div>
  `).join('');
  cont.querySelectorAll('.obra-item').forEach(el=>{
    el.addEventListener('click', ()=>{ obraSelecionadaId = el.dataset.id; capituloSelecionadoIdx = null; renderTudo(); });
  });
}

/* ============================================================
   RENDER: PAINEL PRINCIPAL
   ============================================================ */
function renderDetalhe(){
  const empty = document.getElementById('emptyState');
  const detalhe = document.getElementById('obraDetail');
  const obra = estado.obras.find(o=>o.id===obraSelecionadaId);

  if(!obra){
    detalhe.style.display = 'none';
    renderHome();
    return;
  }
  empty.classList.remove('state-empty','state-dashboard');
  detalhe.style.display = 'block';

  let corpoHtml = '';
  if(obra.tipo === 'livro'){
    if(capituloSelecionadoIdx === null){
      corpoHtml = '<div class="capitulos-lista">' + obra.capitulos.map((cap, i) => `
        <div class="capitulo-link" data-idx="${i}">
          <span class="cap-num-badge">${badgeCapitulo(cap)}</span>
          <span class="cap-link-titulo">${labelCapitulo(cap)}</span>
          <span class="cap-link-preview">${previewCapitulo(cap)}</span>
          <svg class="cap-link-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      `).join('') + '</div>';
    } else {
      const cap = obra.capitulos[capituloSelecionadoIdx];
      const modoLeitura = cap.salvo && (cap.texto||'').trim().length > 0;
      const corpoCapitulo = modoLeitura
        ? `
          <div class="nota-leitura ${cap.justificado?'justificado':''}">${formatarTextoLeitura(cap.texto)}</div>
          <button class="btn-editar-nota" id="btnEditarCapitulo">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
            Editar
          </button>
        `
        : `
          <div class="campo-label">Resumo e impressões</div>
          <div class="format-toolbar">
            <button type="button" class="format-btn" id="btnNegrito" title="Negrito"><strong>B</strong></button>
            <button type="button" class="format-btn" id="btnItalico" title="Itálico"><em>I</em></button>
            <button type="button" class="format-btn ${cap.justificado?'active-format':''}" id="btnJustificar" title="Justificar texto">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
            </button>
          </div>
          <textarea class="nota-field nota-field-grande" id="campoTextoCap" placeholder="Resuma o capítulo e registre suas impressões, citações, conexões…">${escapeHtml(cap.texto||'')}</textarea>
          <button class="btn-salvar-nota" id="btnSalvarCapitulo">Salvar</button>
        `;
      corpoHtml = `
        <button class="btn-voltar" id="btnVoltarCapitulos">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          Voltar aos capítulos
        </button>
        <div class="capitulo-card ${modoLeitura?'modo-leitura':''}">
          <h3><span class="cap-num-badge">${badgeCapitulo(cap)}</span> ${labelCapitulo(cap)}</h3>
          ${corpoCapitulo}
        </div>
      `;
    }
  } else {
    corpoHtml = `
      <div class="nota-livre-card">
        <div class="campo-label">Fichamento / impressões</div>
        <textarea class="nota-field" id="notaLivreField" placeholder="Registre aqui suas notas de leitura…">${escapeHtml(obra.notaGeral||'')}</textarea>
      </div>
    `;
  }

  detalhe.classList.toggle('wide-leitura', obra.tipo==='livro' && capituloSelecionadoIdx !== null);

  detalhe.innerHTML = `
    <div class="obra-header">
      <div>
        <h1>${escapeHtml(obra.titulo)}</h1>
        <p class="autor">${escapeHtml(obra.autor || 'Autor não informado')}</p>
      </div>
      <div class="obra-actions">
        <button class="icon-btn" id="btnEditarObra" title="Editar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button class="icon-btn danger" id="btnExcluirObra" title="Excluir">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
        </button>
      </div>
    </div>
    <div class="obra-tags">
      <span class="tag-static" style="background:var(--${obra.tipo==='livro'?'lavender':obra.tipo==='ensaio'?'sage':'peach'}-soft);color:var(--${obra.tipo==='livro'?'lavender':obra.tipo==='ensaio'?'sage':'peach'}-ink);">${TIPO_LABEL[obra.tipo]}</span>
      ${(obra.tags||[]).map(t=>`<span class="tag-static">#${escapeHtml(t)}</span>`).join('')}
    </div>
    ${corpoHtml}
    <div class="save-hint">Salvo automaticamente neste navegador.</div>
  `;

  document.getElementById('btnEditarObra').addEventListener('click', ()=>abrirModalEdicao(obra));
  document.getElementById('btnExcluirObra').addEventListener('click', ()=>excluirObra(obra.id));

  if(obra.tipo === 'livro'){
    if(capituloSelecionadoIdx === null){
      detalhe.querySelectorAll('.capitulo-link').forEach(el=>{
        el.addEventListener('click', ()=>{
          capituloSelecionadoIdx = Number(el.dataset.idx);
          renderDetalhe();
        });
      });
    } else {
      document.getElementById('btnVoltarCapitulos').addEventListener('click', ()=>{
        capituloSelecionadoIdx = null;
        renderDetalhe();
      });
      const cap = obra.capitulos[capituloSelecionadoIdx];
      const modoLeitura = cap.salvo && (cap.texto||'').trim().length > 0;

      if(modoLeitura){
        document.getElementById('btnEditarCapitulo').addEventListener('click', ()=>{
          cap.salvo = false;
          salvarEstado();
          renderDetalhe();
        });
      } else {
        const campo = document.getElementById('campoTextoCap');
        campo.addEventListener('input', ()=>{
          cap.texto = campo.value;
          salvarEstado();
        });
        document.getElementById('btnSalvarCapitulo').addEventListener('click', ()=>{
          cap.texto = campo.value;
          cap.salvo = true;
          salvarEstado();
          renderDetalhe();
          toast('Notas salvas');
        });
        document.getElementById('btnNegrito').addEventListener('click', ()=> aplicarFormatacao(campo, '**'));
        document.getElementById('btnItalico').addEventListener('click', ()=> aplicarFormatacao(campo, '*'));
        document.getElementById('btnJustificar').addEventListener('click', (e)=>{
          cap.justificado = !cap.justificado;
          e.currentTarget.classList.toggle('active-format', cap.justificado);
          salvarEstado();
        });
      }
    }
  } else {
    const campo = document.getElementById('notaLivreField');
    campo.addEventListener('input', ()=>{
      obra.notaGeral = campo.value;
      salvarEstado();
    });
  }
}

function renderTudo(){
  renderFiltroTags();
  renderLista();
  renderDetalhe();
}

function excluirObra(id){
  if(!confirm('Excluir esta obra e todas as suas notas? Essa ação não pode ser desfeita.')) return;
  estado.obras = estado.obras.filter(o=>o.id!==id);
  if(obraSelecionadaId===id) obraSelecionadaId = null;
  salvarEstado();
  renderTudo();
  toast('Obra excluída');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   MODAL: NOVA / EDITAR OBRA
   ============================================================ */
const modalOverlay = document.getElementById('modalOverlay');
const tipoToggle = document.getElementById('tipoToggle');
let tipoModalAtual = 'livro';

function abrirModalNova(){
  editandoObraId = null;
  tipoModalAtual = 'livro';
  tagsModalAtual = [];
  extrasModalAtual = { prefacio:false, introducao:false, conclusao:false };
  document.getElementById('modalTitulo').textContent = 'Nova obra';
  document.getElementById('campoTitulo').value = '';
  document.getElementById('campoAutor').value = '';
  document.getElementById('campoCapitulos').value = '';
  atualizarTipoToggleUI();
  atualizarExtrasToggleUI();
  renderTagsModal();
  modalOverlay.classList.add('open');
  document.getElementById('campoTitulo').focus();
}

function abrirModalEdicao(obra){
  editandoObraId = obra.id;
  tipoModalAtual = obra.tipo;
  tagsModalAtual = [...(obra.tags||[])];
  const caps = obra.tipo==='livro' ? (obra.capitulos||[]) : [];
  extrasModalAtual = {
    prefacio: caps.some(c=>c.tipo==='prefacio'),
    introducao: caps.some(c=>c.tipo==='introducao'),
    conclusao: caps.some(c=>c.tipo==='conclusao')
  };
  const numCapitulosAtuais = caps.filter(c=>(c.tipo||'capitulo')==='capitulo').length;
  document.getElementById('modalTitulo').textContent = 'Editar obra';
  document.getElementById('campoTitulo').value = obra.titulo;
  document.getElementById('campoAutor').value = obra.autor || '';
  document.getElementById('campoCapitulos').value = obra.tipo==='livro' ? (numCapitulosAtuais || '') : '';
  atualizarTipoToggleUI();
  atualizarExtrasToggleUI();
  renderTagsModal();
  modalOverlay.classList.add('open');
}

function fecharModal(){ modalOverlay.classList.remove('open'); }

function atualizarTipoToggleUI(){
  tipoToggle.querySelectorAll('button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tipo === tipoModalAtual);
  });
  document.getElementById('campoCapitulosWrap').style.display = tipoModalAtual==='livro' ? 'block' : 'none';
  document.getElementById('camposExtrasWrap').style.display = tipoModalAtual==='livro' ? 'block' : 'none';
}

function atualizarExtrasToggleUI(){
  document.querySelectorAll('#extrasToggle .extra-chip').forEach(btn=>{
    btn.classList.toggle('active-extra', !!extrasModalAtual[btn.dataset.extra]);
  });
}

tipoToggle.querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    tipoModalAtual = btn.dataset.tipo;
    atualizarTipoToggleUI();
  });
});

document.querySelectorAll('#extrasToggle .extra-chip').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const k = btn.dataset.extra;
    extrasModalAtual[k] = !extrasModalAtual[k];
    atualizarExtrasToggleUI();
  });
});

function renderTagsModal(){
  const row = document.getElementById('tagInputRow');
  const input = document.getElementById('campoTag');
  row.querySelectorAll('.tag-pill').forEach(p=>p.remove());
  tagsModalAtual.forEach(t=>{
    const pill = document.createElement('span');
    pill.className = 'tag-pill';
    pill.innerHTML = `${escapeHtml(t)} <button type="button">&times;</button>`;
    pill.querySelector('button').addEventListener('click', ()=>{
      tagsModalAtual = tagsModalAtual.filter(x=>x!==t);
      renderTagsModal();
    });
    row.insertBefore(pill, input);
  });
}

document.getElementById('campoTag').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    const v = e.target.value.trim();
    if(v && !tagsModalAtual.includes(v)){
      tagsModalAtual.push(v);
      renderTagsModal();
    }
    e.target.value = '';
  }
});

document.getElementById('btnNovaObra').addEventListener('click', abrirModalNova);
document.getElementById('btnCancelarModal').addEventListener('click', fecharModal);
modalOverlay.addEventListener('click', (e)=>{ if(e.target===modalOverlay) fecharModal(); });

document.getElementById('btnSalvarObra').addEventListener('click', ()=>{
  const titulo = document.getElementById('campoTitulo').value.trim();
  if(!titulo){ toast('Informe um título'); return; }
  const autor = document.getElementById('campoAutor').value.trim();
  const numCap = Number(document.getElementById('campoCapitulos').value) || 0;

  if(editandoObraId){
    const obra = estado.obras.find(o=>o.id===editandoObraId);
    obra.titulo = titulo;
    obra.autor = autor;
    obra.tags = [...tagsModalAtual];
    if(tipoModalAtual === 'livro'){
      const capsAtuais = obra.tipo==='livro' ? obra.capitulos : [];
      obra.capitulos = construirCapitulos(numCap, extrasModalAtual, capsAtuais);
      delete obra.notaGeral;
    } else {
      obra.notaGeral = obra.notaGeral || '';
      delete obra.capitulos;
    }
    obra.tipo = tipoModalAtual;
    capituloSelecionadoIdx = null;
    toast('Obra atualizada');
  } else {
    const novaObra = {
      id: uid(),
      titulo, autor,
      tipo: tipoModalAtual,
      tags: [...tagsModalAtual],
      criadoEm: Date.now()
    };
    if(tipoModalAtual === 'livro'){
      novaObra.capitulos = construirCapitulos(numCap, extrasModalAtual, []);
    } else {
      novaObra.notaGeral = '';
    }
    estado.obras.push(novaObra);
    obraSelecionadaId = novaObra.id;
    capituloSelecionadoIdx = null;
    toast('Obra adicionada');
  }

  salvarEstado();
  fecharModal();
  renderTudo();
});

document.getElementById('busca').addEventListener('input', ()=>{ renderLista(); renderDetalhe(); });

document.getElementById('brandLogo').addEventListener('click', ()=>{
  obraSelecionadaId = null;
  capituloSelecionadoIdx = null;
  renderTudo();
});

document.getElementById('filtroTipo').querySelectorAll('.chip').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const t = btn.dataset.tipo;
    filtroTipoAtivo = (filtroTipoAtivo === t) ? null : t;
    document.getElementById('filtroTipo').querySelectorAll('.chip').forEach(b=>{
      b.classList.toggle('active-tipo', b.dataset.tipo === filtroTipoAtivo);
    });
    renderTudo();
  });
});

/* ============================================================
   SINCRONIZAÇÃO COM GOOGLE DRIVE
   ============================================================ */
const GOOGLE_CLIENT_ID = '677651936598-n5ets1kq4qr95qbfgi62vqvcu8m5g49g.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FILENAME = 'fichario-leituras.json';
let driveAccessToken = null;
let driveFileId = null;
let tokenClient = null;
let syncAutoTimer = null;

function carregarGis(cb){
  if(window.google && window.google.accounts){ cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = cb;
  document.head.appendChild(s);
}

function iniciarSync(){
  carregarGis(()=>{
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: async (resp)=>{
        if(resp.error){ toast('Não foi possível conectar ao Drive'); return; }
        driveAccessToken = resp.access_token;
        document.getElementById('syncStatus').textContent = 'conectado';
        await sincronizarComDrive();
      }
    });
    tokenClient.requestAccessToken();
  });
}

async function encontrarArquivoDrive(){
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers:{ Authorization: `Bearer ${driveAccessToken}` }
  });
  const data = await res.json();
  if(data.files && data.files.length>0){ driveFileId = data.files[0].id; return true; }
  return false;
}

async function baixarDoDrive(){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
    headers:{ Authorization: `Bearer ${driveAccessToken}` }
  });
  return await res.json();
}

async function enviarParaDrive(){
  const metadata = { name: DRIVE_FILENAME, mimeType: 'application/json' };
  const boundary = '-------fichario_boundary';
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(estado)}\r\n--${boundary}--`;

  const url = driveFileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;

  const res = await fetch(url, {
    method: driveFileId ? 'PATCH' : 'POST',
    headers:{ Authorization: `Bearer ${driveAccessToken}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
    body
  });
  const data = await res.json();
  if(data.id) driveFileId = data.id;
}

async function sincronizarComDrive(){
  try{
    document.getElementById('syncStatus').textContent = 'sincronizando…';
    const existe = await encontrarArquivoDrive();
    if(existe){
      const remoto = await baixarDoDrive();
      const localMaisRecente = (estado.obras.length > 0) &&
        (JSON.stringify(estado) !== JSON.stringify(remoto));
      // Estratégia simples: se houver dados locais, eles prevalecem e são enviados;
      // se o local estiver vazio, o remoto é adotado.
      if(estado.obras.length === 0 && remoto && remoto.obras){
        estado = remoto;
        salvarEstadoSemSync();
        renderTudo();
      } else {
        await enviarParaDrive();
      }
    } else {
      await enviarParaDrive();
    }
    const agora = new Date();
    document.getElementById('syncStatus').textContent = 'sincronizado às ' + agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    toast('Sincronizado com o Drive');
  }catch(e){
    document.getElementById('syncStatus').textContent = 'erro ao sincronizar';
    toast('Erro ao sincronizar com o Drive');
  }
}

function salvarEstadoSemSync(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(estado));
}

function agendarSyncAutomatico(){
  if(!driveAccessToken) return;
  clearTimeout(syncAutoTimer);
  syncAutoTimer = setTimeout(()=>{ enviarParaDrive().then(()=>{
    document.getElementById('syncStatus').textContent = 'sincronizado às ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }); }, 2500);
}

document.getElementById('btnSync').addEventListener('click', ()=>{
  if(driveAccessToken){ sincronizarComDrive(); } else { iniciarSync(); }
});

const modalConectarOverlay = document.getElementById('modalConectarOverlay');
document.getElementById('btnConectarAgora').addEventListener('click', ()=>{
  modalConectarOverlay.classList.remove('open');
  iniciarSync();
});
document.getElementById('btnPularConexao').addEventListener('click', ()=>{
  modalConectarOverlay.classList.remove('open');
});
modalConectarOverlay.addEventListener('click', (e)=>{ if(e.target===modalConectarOverlay) modalConectarOverlay.classList.remove('open'); });

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
renderTudo();
modalConectarOverlay.classList.add('open');
</script>
